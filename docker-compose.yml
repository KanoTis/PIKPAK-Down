name: pikpak-down

services:
  app:
    image: ${PIKPAK_IMAGE:-ghcr.io/kanotis/pikpak-share-suite:latest}
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - pikpak-data:/data
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY to a base64url 32-byte key}
    restart: unless-stopped

volumes:
  pikpak-data:
