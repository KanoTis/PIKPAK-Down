services:
  app:
    build: .
    image: pikpak-share-suite
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - pikpak-data:/data
      - ./downloads:/downloads
      - ./cache:/cache
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY to a base64url 32-byte key}
      PIKPAK_DRIVE_BASE_URL: ${PIKPAK_DRIVE_BASE_URL:-https://api-drive.mypikpak.com}
      PIKPAK_USER_BASE_URL: ${PIKPAK_USER_BASE_URL:-https://user.mypikpak.com}
      DOWNLOAD_MAX_CONCURRENCY: ${DOWNLOAD_MAX_CONCURRENCY:-2}
      LINEAGE_MAX_ACTIVE_RUNS: ${LINEAGE_MAX_ACTIVE_RUNS:-1}
    restart: unless-stopped

volumes:
  pikpak-data:
